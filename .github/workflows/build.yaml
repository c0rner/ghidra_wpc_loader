name: Build and Release WPC Loader

on:
  workflow_call:
    inputs:
      ghidra_version:
        description: 'Ghidra version to build against (e.g. 12.1.0)'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ghidra_version:
        description: 'Ghidra version to build against (e.g. 12.1.0)'
        type: string
        required: true

env:
  JAVA_VERSION: 21

jobs:
  build:
    name: Build WPC Loader for Ghidra ${{ inputs.ghidra_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # 6.0.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download Ghidra ${{ inputs.ghidra_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="Ghidra_${{ inputs.ghidra_version }}_build"

          gh release download "$RELEASE_TAG" \
            --repo NationalSecurityAgency/ghidra \
            --pattern "ghidra_*_PUBLIC*.zip" \
            --output "$RUNNER_TEMP/ghidra.zip"

          unzip -q "$RUNNER_TEMP/ghidra.zip" -d /opt/
          GHIDRA_DIR=$(ls -d /opt/ghidra_*/ | head -1)
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> $GITHUB_ENV
          echo "::notice::Ghidra installed in: $GHIDRA_DIR"

      - name: Build extension
        run: |
          chmod +x "$GHIDRA_INSTALL_DIR/support/gradle/gradlew"
          "$GHIDRA_INSTALL_DIR/support/gradle/gradlew" buildExtension

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="Ghidra_${{ inputs.ghidra_version }}_build"
          gh release create "$RELEASE_TAG" dist/*.zip \
            --title "WPC Loader for Ghidra ${{ inputs.ghidra_version }}" \
            --notes "Compatible with **Ghidra ${{ inputs.ghidra_version }}**" \
            --latest
          echo "::notice::New release created for Ghidra ${{ inputs.ghidra_version }}"
